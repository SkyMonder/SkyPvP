<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPvP | Рейтинг дуэлей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fbbf24;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #fbbf24;
        }

        .stat-title {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            color: #fbbf24;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .stat-label {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: #1e293b;
            color: #fbbf24;
            font-weight: 600;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #334155;
        }

        td {
            padding: 15px;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(251, 191, 36, 0.1);
        }

        .rank-1 td:first-child {
            color: gold;
            font-weight: bold;
        }
        .rank-2 td:first-child {
            color: silver;
            font-weight: bold;
        }
        .rank-3 td:first-child {
            color: #cd7f32;
            font-weight: bold;
        }

        .wins {
            color: #4ade80;
            font-weight: 600;
        }
        .losses {
            color: #f87171;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .refresh-btn {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .refresh-btn:hover {
            background: transparent;
            color: #fbbf24;
            border-color: #fbbf24;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .error {
            color: #f87171;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ SkyPvP Duels ⚔️</h1>
        <div class="subtitle">Рейтинг лучших бойцов сервера</div>

        <!-- Карточки общей статистики (заполняются через JS) -->
        <div class="stats-grid" id="stats-cards">
            <div class="stat-card">
                <div class="stat-title">Всего боёв</div>
                <div class="stat-value" id="totalFights">-</div>
                <div class="stat-label">проведено дуэлей</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Активных игроков</div>
                <div class="stat-value" id="activePlayers">-</div>
                <div class="stat-label">с рейтингом</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Топ побед</div>
                <div class="stat-value" id="topWins">-</div>
                <div class="stat-label">максимум побед</div>
            </div>
        </div>

        <!-- Таблица рейтинга -->
        <div class="table-container">
            <table id="rating-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Игрок</th>
                        <th>Победы</th>
                        <th>Поражения</th>
                        <th>Всего боёв</th>
                        <th>Winrate</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" class="loading">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>

        <div style="display: flex; justify-content: center;">
            <button class="refresh-btn" onclick="fetchData()">🔄 Обновить рейтинг</button>
        </div>

        <div class="footer">
            Данные обновляются в реальном времени с сервера SkyPvP
        </div>
    </div>

    <script>
        // Конфигурация – укажите URL вашего API (должен отдавать JSON в формате, описанном ниже)
        const API_URL = '/api/stats'; // замените на свой эндпоинт

        // Пример ожидаемого формата данных (массив объектов):
        // [
        //   { "name": "Player1", "wins": 10, "losses": 2 },
        //   { "name": "Player2", "wins": 5, "losses": 8 }
        // ]

        async function fetchData() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="6" class="loading">Загрузка...</td></tr>';

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const players = await response.json();

                // Сортировка по победам (убывание)
                players.sort((a, b) => b.wins - a.wins);

                // Обновление карточек
                updateStatsCards(players);

                // Заполнение таблицы
                let html = '';
                if (players.length === 0) {
                    html = '<tr><td colspan="6" class="loading">Нет данных</td></tr>';
                } else {
                    players.forEach((player, index) => {
                        const total = player.wins + player.losses;
                        const winrate = total > 0 ? ((player.wins / total) * 100).toFixed(1) : '0.0';
                        const rankClass = index === 0 ? 'rank-1' : (index === 1 ? 'rank-2' : (index === 2 ? 'rank-3' : ''));
                        html += `<tr class="${rankClass}">
                            <td>${index + 1}</td>
                            <td>${escapeHtml(player.name) || 'Неизвестно'}</td>
                            <td class="wins">${player.wins}</td>
                            <td class="losses">${player.losses}</td>
                            <td>${total}</td>
                            <td>${winrate}%</td>
                        </tr>`;
                    });
                }
                tbody.innerHTML = html;
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                tbody.innerHTML = `<tr><td colspan="6" class="error">Ошибка загрузки данных: ${error.message}</td></tr>`;
            }
        }

        function updateStatsCards(players) {
            const totalFights = players.reduce((sum, p) => sum + p.wins + p.losses, 0);
            const activePlayers = players.length;
            const topWins = players.length > 0 ? Math.max(...players.map(p => p.wins)) : 0;

            document.getElementById('totalFights').textContent = totalFights;
            document.getElementById('activePlayers').textContent = activePlayers;
            document.getElementById('topWins').textContent = topWins;
        }

        // Простая защита от XSS (экранирование HTML)
        function escapeHtml(unsafe) {
            if (!unsafe) return unsafe;
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Автообновление каждые 30 секунд
        setInterval(fetchData, 30000);

        // Загрузить при старте
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>

</html>
